name: opencart-qa
services:
  opencart:
    image: opencart-qa:4.1.0.4
    build:
      context: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    environment:
      OPENCART_URL: ${OPENCART_URL:-http://localhost:8080/}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DB_NAME: ${DB_NAME:-opencart}
      DB_USER: ${DB_USER:-opencart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - application:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${DB_NAME:-opencart}
      MYSQL_USER: ${DB_USER:-opencart}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  application:
  database:
