[project]
name = "opencart-qa"
version = "0.1.0"
description = "Automated API and UI tests for OpenCart 4.1.0.4"
requires-python = ">=3.12,<3.14"
dependencies = [
"pytest>=8.3,<10",
"selenium>=4.25,<5",
"requests>=2.32,<3",
"PyMySQL>=1.1,<2",
"PyYAML>=6.0,<7",
"allure-pytest>=2.13,<3",
]

[dependency-groups]
dev = [
"black>=25.1,<27",
"flake8>=7.2,<8",
"pre-commit>=4.2,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_.py"]
python_classes = ["Test"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
"smoke: critical smoke tests",
"api: API tests",
"ui: UI tests using Selenium",
"db: database checks",
"regression: regression tests",
]

[tool.black]
line-length = 100
target-version = ["py312"]
